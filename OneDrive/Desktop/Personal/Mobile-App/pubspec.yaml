name: mobile_app
description: Lumen Scan mobile app (Flutter migration)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.2.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  sqflite: ^2.3.3+1
  uuid: ^4.5.1
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  reorderables: ^0.6.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
