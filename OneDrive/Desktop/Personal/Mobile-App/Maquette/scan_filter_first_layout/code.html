<body class="bg-background text-on-background font-body select-none overflow-hidden">
<!-- Top Navigation Shell -->
<header class="bg-[#131313] dark:bg-[#131313] flex justify-between items-center px-4 h-16 w-full z-50 fixed top-0 border-b border-white/10 dark:border-white/10">

<div class="flex items-center gap-4">

</div>

</div>

</div>
<div class="bg-surface-container-highest/80 backdrop-blur-md px-2 py-1 rounded-lg border border-white/5">

</div>
<span class="font-label text-[9px] tracking-widest text-white/40 uppercase">FLASH</span>

</div>

<button class="flex flex-col items-center gap-2 opacity-40 shrink-0">

<button class="relative w-20 h-20 flex items-center justify-center active:scale-90 transition-transform">

<div class="w-16 h-16 bg-white rounded-full border-4 border-surface shadow-[0_0_20px_rgba(161,201,255,0.4)]"></div>

<a class="flex flex-col items-center justify-center text-[#a1c9ff] border-l-2 border-[#a1c9ff] bg-[#2a2a2a] px-6 py-2 transition-all duration-150 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="view_in_ar" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
<span class="text-[10px] uppercase tracking-widest font-medium font-label mt-1">SCAN</span>
</a>
<!-- DOCS (Inactive) -->
<a class="flex flex-col items-center justify-center text-gray-500 px-6 py-2 hover:text-white transition-all duration-150 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="text-[10px] uppercase tracking-widest font-medium font-label mt-1">DOCS</span>

<!-- SETTINGS (Inactive) -->

<span class="material-symbols-outlined" data-icon="tune">tune</span>
<span class="text-[10px] uppercase tracking-widest font-medium font-label mt-1">SETTINGS</span>
</a>
</nav>
<!-- Side Calibration Bar (Visual Detail) -->
<div class="fixed left-0 top-1/2 -translate-y-1/2 h-48 w-1.5 flex flex-col justify-between items-center z-20">
<div class="w-full h-0.5 bg-primary/40"></div>
<div class="w-full h-0.5 bg-primary/20"></div>
<div class="w-full h-0.5 bg-primary"></div>
<div class="w-full h-0.5 bg-primary/20"></div>
<div class="w-full h-0.5 bg-primary/40"></div>
